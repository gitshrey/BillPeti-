name: Build BillKhata Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare BillKhata Web Assets & Permanent Storage Engine
        run: |
          python3 - << 'PYEOF'
          import os, glob, shutil, json, gzip, base64, zipfile

          for zpath in glob.glob("*.zip"):
              try:
                  with zipfile.ZipFile(zpath, "r") as zf:
                      zf.extractall(".")
              except Exception as e:
                  pass

          os.makedirs("www", exist_ok=True)

          # Check if repo has an index.html with the latest BillKhataPermanentDB engine
          has_latest_storage = False
          if os.path.exists("www/index.html"):
              with open("www/index.html", "rb") as f:
                  if b"BillKhataPermanentDB" in f.read():
                      has_latest_storage = True

          if not has_latest_storage:
              b64_data = ""
              raw_html = gzip.decompress(base64.b64decode(b64_data))
              with open("www/index.html", "wb") as f:
                  f.write(raw_html)
              print("Installed latest BillKhata www/index.html with IndexedDB permanent storage:", len(raw_html), "bytes")

          pkg = {
              "name": "billkhata-android",
              "version": "1.1.0",
              "description": "BillKhata - Shop Bill Organizer",
              "main": "www/index.html",
              "dependencies": {
                  "@capacitor/android": "6.2.0",
                  "@capacitor/core": "6.2.0"
              },
              "devDependencies": {
                  "@capacitor/cli": "6.2.0"
              }
          }
          with open("package.json", "w") as f:
              json.dump(pkg, f, indent=2)

          cap_cfg = {
              "appId": "com.billkhata.shopapp",
              "appName": "BillKhata",
              "webDir": "www",
              "bundledWebRuntime": False,
              "server": {
                  "hostname": "billkhata.local",
                  "androidScheme": "https"
              }
          }
          with open("capacitor.config.json", "w") as f:
              json.dump(cap_cfg, f, indent=2)

          print("Prepared package.json and capacitor.config.json successfully.")
          PYEOF

      - name: Install Capacitor & Generate Android Project
        run: |
          rm -rf node_modules package-lock.json android
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions & Build APK
        run: |
          python3 - << 'PYEOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              m = f.read()
          perms = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
          """
          if "android.permission.CAMERA" not in m:
              m = m.replace("<application", perms + "    <application", 1)
              with open(manifest_path, "w") as f:
                  f.write(m)
          print("Permissions verified in AndroidManifest.xml")
          PYEOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload BillKhata Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BillKhata-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
