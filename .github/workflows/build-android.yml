name: Build BillKhata Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Clean BillKhata App & Excel Backup Engine
        run: |
          python3 - << 'PYEOF'
          import os, json, gzip, base64

          os.makedirs("www", exist_ok=True)

          # Always install the latest clean BillKhata app with Excel Backup & Restore + custom icon
          b64_data = ""
          raw_html = gzip.decompress(base64.b64decode(b64_data))
          with open("www/index.html", "wb") as f:
              f.write(raw_html)
          print("Installed clean BillKhata www/index.html:", len(raw_html), "bytes")

          pkg = {
              "name": "billkhata-android",
              "version": "2.1.0",
              "description": "BillKhata - Shop Bill Organizer",
              "main": "www/index.html",
              "dependencies": {
                  "@capacitor/android": "6.2.0",
                  "@capacitor/core": "6.2.0"
              },
              "devDependencies": {
                  "@capacitor/cli": "6.2.0"
              }
          }
          with open("package.json", "w") as f:
              json.dump(pkg, f, indent=2)

          cap_cfg = {
              "appId": "com.billkhata.shopapp",
              "appName": "BillKhata",
              "webDir": "www",
              "bundledWebRuntime": False,
              "server": {
                  "hostname": "billkhata.local",
                  "androidScheme": "https"
              }
          }
          with open("capacitor.config.json", "w") as f:
              json.dump(cap_cfg, f, indent=2)
          PYEOF

      - name: Install Capacitor & Generate Android Project
        run: |
          rm -rf node_modules package-lock.json android
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Install Custom BillKhata App Icon & Build APK
        run: |
          python3 - << 'PYEOF'
          import os, glob, base64, shutil

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              m = f.read()
          perms = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
          """
          if "android.permission.CAMERA" not in m:
              m = m.replace("<application", perms + "    <application", 1)
              with open(manifest_path, "w") as f:
                  f.write(m)

          icon_bytes = base64.b64decode("")
          res_dir = "android/app/src/main/res"
          for mipmap_dir in glob.glob(os.path.join(res_dir, "mipmap-*")):
              if "anydpi" in mipmap_dir:
                  shutil.rmtree(mipmap_dir, ignore_errors=True)
                  continue
              for icon_name in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                  target_file = os.path.join(mipmap_dir, icon_name)
                  with open(target_file, "wb") as f:
                      f.write(icon_bytes)
          print("Custom BillKhata launcher icon installed across all Android mipmap folders")
          PYEOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload BillKhata Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BillKhata-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
