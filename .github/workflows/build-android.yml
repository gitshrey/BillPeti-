name: Build BillKhata Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Clean BillKhata App & Excel Backup Engine
        run: |
          python3 - << 'PYEOF'
          import os, json, gzip, base64

          os.makedirs("www", exist_ok=True)

          # Always install the latest clean BillKhata app with Excel Backup & Restore + custom icon
          b64_data = ""
          raw_html = gzip.decompress(base64.b64decode(b64_data))
          with open("www/index.html", "wb") as f:
              f.write(raw_html)
          print("Installed clean BillKhata www/index.html:", len(raw_html), "bytes")

          pkg = {
              "name": "billkhata-android",
              "version": "2.1.0",
              "description": "BillKhata - Shop Bill Organizer",
              "main": "www/index.html",
              "dependencies": {
                  "@capacitor/android": "6.2.0",
                  "@capacitor/core": "6.2.0"
              },
              "devDependencies": {
                  "@capacitor/cli": "6.2.0"
              }
          }
          with open("package.json", "w") as f:
              json.dump(pkg, f, indent=2)

          cap_cfg = {
              "appId": "com.billkhata.shopapp",
              "appName": "BillKhata",
              "webDir": "www",
              "bundledWebRuntime": False,
              "server": {
                  "hostname": "billkhata.local",
                  "androidScheme": "https"
              }
          }
          with open("capacitor.config.json", "w") as f:
              json.dump(cap_cfg, f, indent=2)
          PYEOF

      - name: Install Capacitor & Generate Android Project
        run: |
          rm -rf node_modules package-lock.json android
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Install Custom BillKhata App Icon & Build APK
        run: |
          python3 - << 'PYEOF'
          import os, re, glob, base64, shutil

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              m = f.read()
          perms = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
          """
          if "android.permission.CAMERA" not in m:
              m = m.replace("<application", perms + "    <application", 1)
              with open(manifest_path, "w") as f:
                  f.write(m)

          sq_bytes = base64.b64decode("")
          rd_bytes = base64.b64decode("")
          fg_bytes = base64.b64decode("")
          res_dir = "android/app/src/main/res"
          for mipmap_dir in glob.glob(os.path.join(res_dir, "mipmap-*")):
              if "anydpi" in mipmap_dir:
                  continue
              with open(os.path.join(mipmap_dir, "ic_launcher.png"), "wb") as f:
                  f.write(sq_bytes)
              with open(os.path.join(mipmap_dir, "ic_launcher_round.png"), "wb") as f:
                  f.write(rd_bytes)
              with open(os.path.join(mipmap_dir, "ic_launcher_foreground.png"), "wb") as f:
                  f.write(fg_bytes)
          anydpi_dir = os.path.join(res_dir, "mipmap-anydpi-v26")
          os.makedirs(anydpi_dir, exist_ok=True)
          adaptive_xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for xml_name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
              with open(os.path.join(anydpi_dir, xml_name), "w") as xf:
                  xf.write(adaptive_xml)
          values_dir = os.path.join(res_dir, "values")
          os.makedirs(values_dir, exist_ok=True)
          bg_color_xml = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1C4BB3</color>\n</resources>\n'
          with open(os.path.join(values_dir, "ic_launcher_background.xml"), "w") as cf:
              cf.write(bg_color_xml)

          styles_xml_path = os.path.join(values_dir, "styles.xml")
          if os.path.exists(styles_xml_path):
              with open(styles_xml_path, "r", encoding="utf-8") as sf:
                  s_content = sf.read()
              if 'name="android:windowBackground"' not in s_content:
                  s_content = s_content.replace('</style>', '    <item name="android:windowBackground">#1763E8</item>\n    </style>', 1)
                  with open(styles_xml_path, "w", encoding="utf-8") as sf:
                      sf.write(s_content)
              print("Patched Android styles.xml with seamless windowBackground #1763E8")
          print("Custom BillKhata Adaptive Icon installed across all Android mipmap folders")
          main_act_dir = "android/app/src/main/java/com/billkhata/shopapp"
          os.makedirs(main_act_dir, exist_ok=True)
          main_act_b64 = ""
          with open(os.path.join(main_act_dir, "MainActivity.java"), "wb") as mf:
              mf.write(base64.b64decode(main_act_b64))
          print("Installed native AndroidDownloader bridge for direct Downloads folder export")
          keystore_b64 = ""
          ks_bytes = base64.b64decode(keystore_b64)
          user_android_dir = os.path.expanduser("~/.android")
          os.makedirs(user_android_dir, exist_ok=True)
          with open(os.path.join(user_android_dir, "debug.keystore"), "wb") as kf:
              kf.write(ks_bytes)
          perm_ks_path = os.path.abspath("android/app/billkhata-permanent.keystore")
          with open(perm_ks_path, "wb") as kf:
              kf.write(ks_bytes)
          gradle_file = "android/app/build.gradle"
          with open(gradle_file, "r") as gf:
              g_txt = gf.read()
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER", "1") or "1")
          new_ver_code = 100 + run_num
          g_txt = re.sub(r'versionCode\s+\d+', f'versionCode {new_ver_code}', g_txt)
          g_txt = re.sub(r'versionName\s+"[^"]+"', f'versionName "2.{run_num}"', g_txt)
          signing_cfg = "    signingConfigs { debug { storeFile file('billkhata-permanent.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }\n"
          if "billkhata-permanent.keystore" not in g_txt:
              g_txt = g_txt.replace("buildTypes {", signing_cfg + "    buildTypes {", 1)
          with open(gradle_file, "w") as gf:
              gf.write(g_txt)
          print(f"Configured permanent signing keystore and versionCode={new_ver_code}")
          PYEOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK to BillKhata.apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/BillKhata.apk

      - name: Upload BillKhata Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BillKhata-Installable-APK
          path: dist/BillKhata.apk

      - name: Create GitHub Release with direct BillKhata.apk download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v2.${{ github.run_number }}
          name: BillKhata v2.${{ github.run_number }}
          body: |
            ### 📱 BillKhata (बिल खाता) Installable APK
            Download **BillKhata.apk** directly below and install it on your Android phone.
            - Updates seamlessly over existing versions without data loss.
            - 100% Offline, Safe & Private.
          files: dist/BillKhata.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
