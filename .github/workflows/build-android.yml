name: Build BillKhata Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare BillKhata Web Assets & Config
        run: |
          python3 - << 'PYEOF'
          import os, glob, shutil, json, gzip, base64, zipfile

          # 1. If user uploaded a zip file into the repo, extract it first
          for zpath in glob.glob("*.zip"):
              try:
                  with zipfile.ZipFile(zpath, "r") as zf:
                      zf.extractall(".")
                  print("Extracted zip:", zpath)
              except Exception as e:
                  print("Zip note:", e)

          os.makedirs("www", exist_ok=True)

          # 2. Find index.html anywhere in repo if www/index.html is not yet present
          if not os.path.exists("www/index.html"):
              for root, dirs, files in os.walk("."):
                  if "index.html" in files and "node_modules" not in root:
                      src = os.path.join(root, "index.html")
                      if os.path.abspath(src) != os.path.abspath("www/index.html"):
                          shutil.copy(src, "www/index.html")
                          print("Copied index.html from", src)
                          break

          # 3. Built-in fallback: decode embedded BillKhata app if www/index.html is still missing
          if not os.path.exists("www/index.html") or os.path.getsize("www/index.html") < 100:
              b64_data = ""
              raw_html = gzip.decompress(base64.b64decode(b64_data))
              with open("www/index.html", "wb") as f:
                  f.write(raw_html)
              print("Restored www/index.html from embedded bundle:", len(raw_html), "bytes")

          # 4. Write clean package.json
          pkg = {
              "name": "billkhata-android",
              "version": "1.0.0",
              "description": "BillKhata - Shop Bill Organizer",
              "main": "www/index.html",
              "dependencies": {
                  "@capacitor/android": "6.2.0",
                  "@capacitor/core": "6.2.0"
              },
              "devDependencies": {
                  "@capacitor/cli": "6.2.0"
              }
          }
          with open("package.json", "w") as f:
              json.dump(pkg, f, indent=2)

          # 5. Write clean capacitor.config.json
          cap_cfg = {
              "appId": "com.billkhata.shopapp",
              "appName": "BillKhata",
              "webDir": "www",
              "bundledWebRuntime": False
          }
          with open("capacitor.config.json", "w") as f:
              json.dump(cap_cfg, f, indent=2)

          print("Prepared www/index.html, package.json, and capacitor.config.json successfully.")
          PYEOF

      - name: Install Capacitor & Generate Android Project
        run: |
          rm -rf node_modules package-lock.json android
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Configure Android Permissions & Build APK
        run: |
          python3 - << 'PYEOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              m = f.read()
          perms = """    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
          """
          if "android.permission.CAMERA" not in m:
              m = m.replace("<application", perms + "    <application", 1)
              with open(manifest_path, "w") as f:
                  f.write(m)
          print("Permissions verified in AndroidManifest.xml")
          PYEOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload BillKhata Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: BillKhata-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
